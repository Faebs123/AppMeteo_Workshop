<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Meteo App - Browser Version</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Questo contenitore ospiterà il tuo JFrame Swing */
        #container {
            width: 700px;
            height: 720px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5); /* Opzionale: aggiunge un'ombra per far risaltare l'app */
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        (async function () {
            // 1. Inizializza l'ambiente CheerpJ 4.3
            await cheerpjInit();
            
            // 2. Vincola la visualizzazione dell'interfaccia Swing all'interno del tuo div #container
            cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
            
            // 3. Esegui l'applicazione passando il percorso relativo del file JAR
            await cheerpjRunJar("/app/app.jar");
        })();
    </script>
</body>
</html>
