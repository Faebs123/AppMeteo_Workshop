<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Meteo App</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0f2027;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container {
      width: 700px; height: 720px;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    await cheerpjInit({ version: 17 });
    cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
    await cheerpjRunMain(
      "com.example.weather.WeatherApp",
      "/app/app.jar"
    );
  </script>
</body>
</html>
