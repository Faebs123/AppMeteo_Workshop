<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Meteo App</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    body { margin: 0; background: #0f2027; }
    #container { width: 100vw; height: 100svh; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    await cheerpjInit({ version: 17 });
    cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
    await cheerpjRunMain(
      "com.example.weather.WeatherApp",
      "/app/meteoapp.jar"
    );
  </script>
</body>
</html>
